<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markdown Profile Text Toggles</title>
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 2rem auto;
        max-width: 700px;
        line-height: 1.5;
        padding: 0 1rem;
      }

      .toggle-item {
        margin-bottom: 1rem;
        border: 1px solid #d0d7de;
        border-radius: 8px;
      }

      .toggle-item button {
        width: 100%;
        text-align: left;
        background: #f6f8fa;
        border: 0;
        padding: 0.75rem 1rem;
        font-size: 1rem;
        cursor: pointer;
      }

      .content {
        display: none;
        padding: 1rem;
      }

      .content.show {
        display: block;
      }
    </style>
  </head>
  <body>
    <h1>Profile Notes</h1>

    <section class="toggle-item">
      <button type="button" aria-expanded="false" aria-controls="item-1" data-target="item-1">
        Toggle Text 1
      </button>
      <div id="item-1" class="content">
        <p><strong>About:</strong> This is the first markdown-style text instance.</p>
      </div>
    </section>

    <section class="toggle-item">
      <button type="button" aria-expanded="false" aria-controls="item-2" data-target="item-2">
        Toggle Text 2
      </button>
      <div id="item-2" class="content">
        <p><em>Skills:</em> This is the second markdown-style text instance.</p>
      </div>
    </section>

    <section class="toggle-item">
      <button type="button" aria-expanded="false" aria-controls="item-3" data-target="item-3">
        Toggle Text 3
      </button>
      <div id="item-3" class="content">
        <p><code>Contact:</code> This is the third markdown-style text instance.</p>
      </div>
    </section>

    <script>
      document.querySelectorAll("[data-target]").forEach((button) => {
        button.addEventListener("click", () => {
          const content = document.getElementById(button.dataset.target);
          const isVisible = content.classList.toggle("show");
          button.setAttribute("aria-expanded", String(isVisible));
        });
      });
    </script>
  </body>
</html>
